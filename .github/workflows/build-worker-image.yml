name: Build and Push Worker Images

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "Dockerfile"
      - ".github/workflows/build-worker-image.yml"

permissions:
  contents: read
  packages: write
  checks: write
  statuses: write

jobs:
  validate-blender-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate the pinned Blender Python decoder asset
        run: |
          set -eu
          publish_diagnostic() {
            local label="$1"
            local output="$2"
            local payload
            payload="$(jq -n \
              --arg name "RenderBoost worker decoder preflight ($label)" \
              --arg head_sha "$GITHUB_SHA" \
              --arg title "$label" \
              --arg summary "$output" \
              '{name: $name, head_sha: $head_sha, status: "completed", conclusion: "failure", output: {title: $title, summary: $summary}}')"
            curl -fsSL -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/check-runs" \
              -d "$payload" >/dev/null || true
            local description
            description="$(printf '%s' "$output" | tr '\n' ' ' | cut -c1-140)"
            curl -fsSL -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -d "$(jq -n --arg state failure --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --arg description "$description" --arg context "renderboost/worker-decoder-preflight/$label" '{state: $state, target_url: $target_url, description: $description, context: $context}')" >/dev/null || true
          }
          run_checked() {
            local label="$1"
            shift
            set +e
            local output
            output="$("$@" 2>&1)"
            local status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -ne 0 ]; then
              publish_diagnostic "$label" "$output"
              return "$status"
            fi
          }
          work_dir="$(mktemp -d)"
          blender_archive="$work_dir/blender-safe.tar.xz"
          decoder_wheel="$work_dir/openimageio.whl"
          run_checked download-blender curl -fsSL "https://github.com/agsdaegrytewwerty/ehrtedsaf/releases/download/blender-5.2.0-cycles-headless-rtx-osl-ffmpeg-audio-v2/blender-5.2.0-linux-x64-cycles-headless-rtx-osl-audio-lean-v4-safe.tar.xz" -o "$blender_archive"
          run_checked verify-blender sh -c "printf '%s  %s\\n' 'b7fb6011e3a65bbb475bd3c471a75a333548ff9d75c5f10774ffadbc6eb1adb' '$blender_archive' | sha256sum -c -"
          mkdir -p "$work_dir/blender"
          run_checked extract-blender tar -xJf "$blender_archive" -C "$work_dir/blender"
          site_packages="$work_dir/blender/blender-5.2.0-linux-x64/5.2/python/lib/python3.13/site-packages"
          run_checked verify-numpy test -d "$site_packages/numpy"
          run_checked download-decoder curl -fsSL "https://files.pythonhosted.org/packages/b6/d9/6cf4c59529956eb98df523a797ef7c71e6e241676720f9b443c18e53bf35/openimageio-3.1.17.0-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl" -o "$decoder_wheel"
          run_checked verify-decoder-size sh -c "test \"\$(wc -c < '$decoder_wheel' | tr -d '[:space:]')\" = '6918964'"
          run_checked verify-decoder-sha sh -c "printf '%s  %s\\n' '420a2cbfc7358c281a0902e9daa4ee229e7cb9071be4704ddf8943930c184f78' '$decoder_wheel' | sha256sum -c -"
          run_checked extract-decoder python3 -c 'import pathlib,sys,zipfile; p=pathlib.Path(sys.argv[1]); d=pathlib.Path(sys.argv[2]); z=zipfile.ZipFile(p); [(_ for _ in ()).throw(SystemExit(f"unsafe wheel member: {e.filename}")) if pathlib.PurePosixPath(e.filename).is_absolute() or ".." in pathlib.PurePosixPath(e.filename).parts else z.extract(e, d) for e in z.infolist()]' "$decoder_wheel" "$site_packages"
          decoder_root="$site_packages/OpenImageIO"
          run_checked verify-decoder-extension test -f "$decoder_root/OpenImageIO.cpython-313-x86_64-linux-gnu.so"
          run_checked verify-decoder-library test -f "$decoder_root/lib/libOpenImageIO.so.3.1.17"
          export LD_LIBRARY_PATH="$decoder_root/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          run_checked decoder-probe "$work_dir/blender/blender-5.2.0-linux-x64/5.2/python/bin/python3.13" -I -c 'import OpenImageIO as oiio, numpy; print("module", oiio.__file__); print("numpy", numpy.__version__); print("formats", oiio.get_string_attribute("format_list")); required = {"openexr", "jpeg", "png", "tiff", "webp"}; formats = set(oiio.get_string_attribute("format_list").split(",")); assert required <= formats, (required - formats, oiio.VERSION_STRING); print("version", oiio.VERSION_STRING)'

  build-and-push:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: sm86
            url: "https://github.com/agsdaegrytewwerty/ehrtedsaf/releases/download/blender-5.2.0-cycles-headless-rtx-osl-ffmpeg-audio-v2/blender-5.2.0-linux-x64-cycles-headless-rtx-osl-audio-lean-v4-sm86.tar.xz"
            sha256: "51b560e12d6b759a895a8ef3a1161c74a1e83e55d537845463ccb707b1a34e5c"
            artifact_id: "blender-5.2.0-cycles-headless-rtx-osl-ffmpeg-audio-v2:51b560e12d6b759a895a8ef3a1161c74a1e83e55d537845463ccb707b1a34e5c"
          - variant: sm89
            url: "https://github.com/agsdaegrytewwerty/ehrtedsaf/releases/download/blender-5.2.0-cycles-headless-rtx-osl-ffmpeg-audio-v2/blender-5.2.0-linux-x64-cycles-headless-rtx-osl-audio-lean-v4-sm89.tar.xz"
            sha256: "a5f79d0e6b13a0474c5a2ad64eb38b515d6929948deca1864d81bc0946915878"
            artifact_id: "blender-5.2.0-cycles-headless-rtx-osl-ffmpeg-audio-v2:a5f79d0e6b13a0474c5a2ad64eb38b515d6929948deca1864d81bc0946915878"
          - variant: sm75
            url: "https://github.com/agsdaegrytewwerty/ehrtedsaf/releases/download/blender-5.2.0-cycles-headless-rtx-osl-ffmpeg-audio-v2/blender-5.2.0-linux-x64-cycles-headless-rtx-osl-audio-lean-v4-sm75.tar.xz"
            sha256: "b2c15a5ffe19573a1716f666ae96390ba993be34c04b452185c149263a83c8fb"
            artifact_id: "blender-5.2.0-cycles-headless-rtx-osl-ffmpeg-audio-v2:b2c15a5ffe19573a1716f666ae96390ba993be34c04b452185c149263a83c8fb"
          - variant: sm120
            url: "https://github.com/agsdaegrytewwerty/ehrtedsaf/releases/download/blender-5.2.0-cycles-headless-rtx-osl-ffmpeg-audio-v2/blender-5.2.0-linux-x64-cycles-headless-rtx-osl-audio-lean-v4-sm120.tar.xz"
            sha256: "086a14ce4cd79588d665aad03cb98e737a50db158e3086ed79aa167eb8b1bbb5"
            artifact_id: "blender-5.2.0-cycles-headless-rtx-osl-ffmpeg-audio-v2:086a14ce4cd79588d665aad03cb98e737a50db158e3086ed79aa167eb8b1bbb5"
          - variant: safe
            url: "https://github.com/agsdaegrytewwerty/ehrtedsaf/releases/download/blender-5.2.0-cycles-headless-rtx-osl-ffmpeg-audio-v2/blender-5.2.0-linux-x64-cycles-headless-rtx-osl-audio-lean-v4-safe.tar.xz"
            sha256: "b7fb6011e3a65bbb475bd3c471a75a333548ff9d75c5f10774ffadbc6eb1adb"
            artifact_id: "blender-5.2.0-cycles-headless-rtx-osl-ffmpeg-audio-v2:b7fb6011e3a65bbb475bd3c471a75a333548ff9d75c5f10774ffadbc6eb1adb"
          - variant: base
            url: ""
            sha256: ""
            artifact_id: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure image tags
        id: tags
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/renderboost-worker"
          TAGS="${IMAGE_NAME}:rbdeps-${GITHUB_SHA}-${{ matrix.variant }}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            BLENDER_VARIANT=${{ matrix.variant }}
            BLENDER_URL=${{ matrix.url }}
            BLENDER_SHA256=${{ matrix.sha256 }}
            BLENDER_ARTIFACT_ID=${{ matrix.artifact_id }}
            NODE_SHA256=406791658a8bce3bc21fab786f45877adad391ea20badc87e1d65c7478b75062
            OPENIMAGEIO_WHEEL_SHA256=420a2cbfc7358c281a0902e9daa4ee229e7cb9071be4704ddf8943930c184f78
            OPENIMAGEIO_WHEEL_BYTES=6918964
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
          provenance: false
          sbom: false
