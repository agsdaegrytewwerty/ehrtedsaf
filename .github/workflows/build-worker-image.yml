name: Build and Push Worker Images

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "Dockerfile"
      - "patches/mesa/**"
      - "scripts/build_eevee_mesa.sh"
      - "scripts/write_eevee_mesa_manifest.py"
      - "tests/mesa/**"
      - "tests/test_mesa_*.py"
      - ".github/workflows/build-worker-image.yml"

permissions:
  contents: read
  packages: write
  checks: write
  statuses: write

jobs:
  validate-blender-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate the pinned Blender Python decoder asset
        run: |
          set -eu
          publish_diagnostic() {
            local label="$1"
            local output="$2"
            local payload
            payload="$(jq -n \
              --arg name "RenderBoost worker decoder preflight ($label)" \
              --arg head_sha "$GITHUB_SHA" \
              --arg title "$label" \
              --arg summary "$output" \
              '{name: $name, head_sha: $head_sha, status: "completed", conclusion: "failure", output: {title: $title, summary: $summary}}')"
            curl -fsSL -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/check-runs" \
              -d "$payload" >/dev/null || true
            local description
            description="$(printf '%s' "$output" | tr '\n' ' ' | cut -c1-140)"
            echo "::error title=$label::$description"
            curl -fsSL -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -d "$(jq -n --arg state failure --arg target_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --arg description "$description" --arg context "renderboost/worker-decoder-preflight/$label" '{state: $state, target_url: $target_url, description: $description, context: $context}')" >/dev/null || true
          }
          run_checked() {
            local label="$1"
            shift
            set +e
            local output
            output="$("$@" 2>&1)"
            local status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -ne 0 ]; then
              echo "::error title=$label::$(printf '%s' "$output" | tr '\n' ' ' | cut -c1-140)"
              publish_diagnostic "$label" "$output"
              return "$status"
            fi
          }
          work_dir="$(mktemp -d)"
          blender_archive="$work_dir/blender-safe.tar.xz"
          decoder_wheel="$work_dir/openimageio.whl"
          run_checked download-blender curl -fsSL "https://github.com/agsdaegrytewwerty/ehrtedsaf/releases/download/blender-5.3.0-cycles-headless-rtx-osl-ffmpeg-audio-v1/blender-5.3.0-linux-x64-cycles-headless-rtx-osl-audio-lean-v5-safe.tar.xz" -o "$blender_archive"
          run_checked verify-blender sh -c 'printf "%s  %s\n" "$1" "$2" | sha256sum -c -' sh '056c642418bd058541939e195d10a34fd17343c49ed50bb32f943c3e50fd2ad1' "$blender_archive"
          mkdir -p "$work_dir/blender"
          run_checked extract-blender tar -xJf "$blender_archive" -C "$work_dir/blender"
          site_packages="$work_dir/blender/blender-5.3.0-linux-x64/5.3/python/lib/python3.13/site-packages"
          run_checked verify-numpy test -d "$site_packages/numpy"
          run_checked download-decoder curl -fsSL "https://files.pythonhosted.org/packages/b6/d9/6cf4c59529956eb98df523a797ef7c71e6e241676720f9b443c18e53bf35/openimageio-3.1.17.0-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl" -o "$decoder_wheel"
          run_checked verify-decoder-size sh -c 'test "$(wc -c < "$1" | tr -d "[:space:]")" = 6918964' sh "$decoder_wheel"
          run_checked verify-decoder-sha sh -c 'printf "%s  %s\n" "$1" "$2" | sha256sum -c -' sh '420a2cbfc7358c281a0902e9daa4ee229e7cb9071be4704ddf8943930c184f78' "$decoder_wheel"
          run_checked extract-decoder python3 -c 'import pathlib,sys,zipfile; p=pathlib.Path(sys.argv[1]); d=pathlib.Path(sys.argv[2]); z=zipfile.ZipFile(p); [(_ for _ in ()).throw(SystemExit(f"unsafe wheel member: {e.filename}")) if pathlib.PurePosixPath(e.filename).is_absolute() or ".." in pathlib.PurePosixPath(e.filename).parts else z.extract(e, d) for e in z.infolist()]' "$decoder_wheel" "$site_packages"
          decoder_root="$site_packages/OpenImageIO"
          run_checked verify-decoder-extension test -f "$decoder_root/OpenImageIO.cpython-313-x86_64-linux-gnu.so"
          run_checked verify-decoder-library test -f "$decoder_root/lib/libOpenImageIO.so.3.1.17"
          export LD_LIBRARY_PATH="$decoder_root/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          run_checked decoder-probe "$work_dir/blender/blender-5.3.0-linux-x64/5.3/python/bin/python3.13" -I -c 'import OpenImageIO as oiio, numpy; print("module", oiio.__file__); print("numpy", numpy.__version__); print("formats", oiio.get_string_attribute("format_list")); required = {"openexr", "jpeg", "png", "tiff", "webp"}; formats = set(oiio.get_string_attribute("format_list").split(",")); assert required <= formats, (required - formats, oiio.VERSION_STRING); print("version", oiio.VERSION_STRING)'
          run_checked blender-version "$work_dir/blender/blender-5.3.0-linux-x64/blender" --version

  build-and-push:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: sm86
            url: "https://github.com/agsdaegrytewwerty/ehrtedsaf/releases/download/blender-5.3.0-cycles-headless-rtx-osl-ffmpeg-audio-v1/blender-5.3.0-linux-x64-cycles-headless-rtx-osl-audio-lean-v5-sm86.tar.xz"
            sha256: "09a4f18bdfe22d999228090c18b1d1c09766997656fb11309b37cc4de7e6332b"
            artifact_id: "blender-5.3.0-cycles-headless-rtx-osl-ffmpeg-audio-v1:09a4f18bdfe22d999228090c18b1d1c09766997656fb11309b37cc4de7e6332b"
          - variant: sm89
            url: "https://github.com/agsdaegrytewwerty/ehrtedsaf/releases/download/blender-5.3.0-cycles-headless-rtx-osl-ffmpeg-audio-v1/blender-5.3.0-linux-x64-cycles-headless-rtx-osl-audio-lean-v5-sm89.tar.xz"
            sha256: "c839d626825e4e131a4d4892dc4aa320414fd5cc4381587fa38db8c43387a231"
            artifact_id: "blender-5.3.0-cycles-headless-rtx-osl-ffmpeg-audio-v1:c839d626825e4e131a4d4892dc4aa320414fd5cc4381587fa38db8c43387a231"
          - variant: sm75
            url: "https://github.com/agsdaegrytewwerty/ehrtedsaf/releases/download/blender-5.3.0-cycles-headless-rtx-osl-ffmpeg-audio-v1/blender-5.3.0-linux-x64-cycles-headless-rtx-osl-audio-lean-v5-sm75.tar.xz"
            sha256: "ec556f8db34e1d0ee910e8c178baefd6f99bca24e40dcee38e17dd2cbdcefd7c"
            artifact_id: "blender-5.3.0-cycles-headless-rtx-osl-ffmpeg-audio-v1:ec556f8db34e1d0ee910e8c178baefd6f99bca24e40dcee38e17dd2cbdcefd7c"
          - variant: sm120
            url: "https://github.com/agsdaegrytewwerty/ehrtedsaf/releases/download/blender-5.3.0-cycles-headless-rtx-osl-ffmpeg-audio-v1/blender-5.3.0-linux-x64-cycles-headless-rtx-osl-audio-lean-v5-sm120.tar.xz"
            sha256: "5e2ab464b376351b5a1bdb4b34182f310271793aee6d2d7d32325d0743b742b6"
            artifact_id: "blender-5.3.0-cycles-headless-rtx-osl-ffmpeg-audio-v1:5e2ab464b376351b5a1bdb4b34182f310271793aee6d2d7d32325d0743b742b6"
          - variant: safe
            url: "https://github.com/agsdaegrytewwerty/ehrtedsaf/releases/download/blender-5.3.0-cycles-headless-rtx-osl-ffmpeg-audio-v1/blender-5.3.0-linux-x64-cycles-headless-rtx-osl-audio-lean-v5-safe.tar.xz"
            sha256: "056c642418bd058541939e195d10a34fd17343c49ed50bb32f943c3e50fd2ad1"
            artifact_id: "blender-5.3.0-cycles-headless-rtx-osl-ffmpeg-audio-v1:056c642418bd058541939e195d10a34fd17343c49ed50bb32f943c3e50fd2ad1"
          - variant: base
            url: ""
            sha256: ""
            artifact_id: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure image tags
        id: tags
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/renderboost-worker"
          TAGS="${IMAGE_NAME}:rbdeps-${GITHUB_SHA}-${{ matrix.variant }}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            BLENDER_VARIANT=${{ matrix.variant }}
            BLENDER_URL=${{ matrix.url }}
            BLENDER_SHA256=${{ matrix.sha256 }}
            BLENDER_ARTIFACT_ID=${{ matrix.artifact_id }}
            BLENDER_VERSION=5.3.0
            BLENDER_SERIES=5.3
            NODE_SHA256=406791658a8bce3bc21fab786f45877adad391ea20badc87e1d65c7478b75062
            OPENIMAGEIO_WHEEL_SHA256=420a2cbfc7358c281a0902e9daa4ee229e7cb9071be4704ddf8943930c184f78
            OPENIMAGEIO_WHEEL_BYTES=6918964
          cache-from: |
            type=gha,scope=${{ matrix.variant }}
            type=gha,scope=base
            type=gha,scope=sm86
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
          provenance: false
          sbom: false
