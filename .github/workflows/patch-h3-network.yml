name: Patch ProjectSwift H3 Network Binding

on:
  workflow_dispatch:
    inputs:
      worker_base_image:
        description: Verified worker image digest
        required: true
        type: string
      conditioning_base_image:
        description: Verified conditioning image digest
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        role: [worker, conditioning]
    steps:
      - uses: actions/checkout@v4
      - name: Make room for model layers
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          docker system prune -af
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse weights, verify audio and both listeners, publish
        id: image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.h3-network
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=${{ matrix.role == 'worker' && inputs.worker_base_image || inputs.conditioning_base_image }}
          tags: ghcr.io/${{ github.repository_owner }}/projectswift-comfyui:h3-net-${{ matrix.role }}-${{ github.sha }}
          provenance: false
          sbom: false
      - name: Record immutable image
        run: |
          printf 'H3 %s network patch: `ghcr.io/%s/projectswift-comfyui@%s`\n' \
            '${{ matrix.role }}' '${{ github.repository_owner }}' '${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
