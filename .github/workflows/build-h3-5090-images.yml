name: Build H3 RTX 5090 images

on:
  push:
    branches: [salad-h3-5090]
    paths:
      - h3-5090/Dockerfile
      - h3-5090/docker-bake.hcl
      - h3-5090/start.py
      - h3-5090/models.json
      - h3-5090/torch.constraints.txt
      - h3-5090/comfy_salad_h3/**
      - .github/workflows/build-h3-5090-images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: h3-5090-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PACKAGE: ghcr.io/agsdaegrytewwerty/projectswift-comfyui
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the two role images
        id: images
        uses: docker/bake-action@v6
        with:
          workdir: h3-5090
          files: docker-bake.hcl
          push: true
          provenance: false
          sbom: false
      - name: Verify GHCR manifest sizes
        env:
          BUILD_METADATA: ${{ steps.images.outputs.metadata }}
        run: |
          for role in encoder render; do
            digest="$(jq -er --arg role "$role" '.[$role]["containerimage.digest"]' <<< "$BUILD_METADATA")"
            ref="$PACKAGE@$digest"
            docker buildx imagetools inspect --raw "$ref" > "$role.json"
            compressed="$(jq -er '.layers | map(.size) | add' "$role.json")"
            largest="$(jq -er '.layers | map(.size) | max' "$role.json")"
            test "$compressed" -lt 35000000000
            test "$largest" -lt 10000000000
            printf '%s image `%s` (%s bytes total, %s largest layer)\n\n' \
              "$role" "$ref" "$compressed" "$largest" >> "$GITHUB_STEP_SUMMARY"
          done
