name: Build Blender Cycles Runtime

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-blender-cycles-runtime.yml"
      - "blender-cycles-headless-rtx.cmake"
      - "blender-cycles-headless-rtx-audio.cmake"
      - "trim_blender_runtime_tree.sh"
      - "verify_blender_runtime_tree.sh"
      - "README.md"
  workflow_dispatch:
    inputs:
      blender_version:
        description: Blender version tag without leading v
        required: false
        default: "5.2.0"
      release_tag:
        description: Release tag to publish
        required: false
        default: "blender-5.2.0-cycles-headless-rtx-osl-ffmpeg-v4"
      runtime_profile:
        description: Runtime feature profile
        required: false
        type: choice
        options:
          - standard
          - audio
        default: standard

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BLENDER_VERSION: ${{ inputs.blender_version || '5.2.0' }}
      RELEASE_TAG: ${{ inputs.release_tag || 'blender-5.2.0-cycles-headless-rtx-osl-ffmpeg-v4' }}
      RUNTIME_PROFILE: ${{ inputs.runtime_profile || 'standard' }}
      RUNTIME_ASSET_FLAVOR: lean-v4
      OPTIX_HEADERS_COMMIT: df7390b16bce5244b7352ca6d3e320f838297072
      REFERENCE_SAFE_BYTES: "244199308"
      PROTECTED_STANDARD_RELEASE_TAG: blender-5.2.0-cycles-headless-rtx-osl-ffmpeg-v3
      PROTECTED_AUDIO_RELEASE_TAG: blender-5.2.0-cycles-headless-rtx-osl-ffmpeg-audio-v1
    steps:
      - name: Check out release repo
        uses: actions/checkout@v4

      - name: Resolve build profile and protect release identity
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            for protected_tag in \
              "${PROTECTED_STANDARD_RELEASE_TAG}" \
              "${PROTECTED_AUDIO_RELEASE_TAG}"; do
              if [[ "${RELEASE_TAG}" == "${protected_tag}" ]]; then
                echo "Refusing to overwrite protected release tag: ${RELEASE_TAG}" >&2
                exit 1
              fi
            done

            existing_tag="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}")"
            if [[ -n "${existing_tag}" ]]; then
              echo "Refusing to overwrite existing release tag: ${RELEASE_TAG}" >&2
              exit 1
            fi
          fi

          case "${RUNTIME_PROFILE}" in
            standard)
              cmake_profile="${GITHUB_WORKSPACE}/blender-cycles-headless-rtx.cmake"
              asset_suffix="-${RUNTIME_ASSET_FLAVOR}"
              expect_audio="0"
              release_name="Blender ${BLENDER_VERSION} lean cycles headless RTX + OSL runtime"
              if [[ "${RELEASE_TAG}" == *audio* ]]; then
                echo "Standard builds may not publish to an audio release tag: ${RELEASE_TAG}" >&2
                exit 1
              fi
              ;;
            audio)
              cmake_profile="${GITHUB_WORKSPACE}/blender-cycles-headless-rtx-audio.cmake"
              asset_suffix="-audio-${RUNTIME_ASSET_FLAVOR}"
              expect_audio="1"
              release_name="Blender ${BLENDER_VERSION} lean cycles headless RTX + OSL + Audio runtime"
              if [[ "${RELEASE_TAG}" == "${PROTECTED_STANDARD_RELEASE_TAG}" || "${RELEASE_TAG}" != *audio* ]]; then
                echo "Audio builds require a distinct release tag containing 'audio'; refusing ${RELEASE_TAG}." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported runtime profile: ${RUNTIME_PROFILE}" >&2
              exit 1
              ;;
          esac
          test -f "${cmake_profile}"
          {
            echo "CMAKE_PROFILE=${cmake_profile}"
            echo "ASSET_SUFFIX=${asset_suffix}"
            echo "EXPECT_AUDIO=${expect_audio}"
            echo "RELEASE_NAME=${release_name}"
          } >> "${GITHUB_ENV}"

      - name: Install build tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git \
            git-lfs \
            ca-certificates \
            binutils \
            cmake \
            curl \
            ninja-build \
            clang-18 \
            ffmpeg \
            libegl-dev \
            lld-18 \
            ripgrep \
            xz-utils

      - name: Clone Blender source
        run: |
          set -euxo pipefail
          export GIT_LFS_SKIP_SMUDGE=1
          git clone --depth 1 --branch "v${BLENDER_VERSION}" https://projects.blender.org/blender/blender.git blender-src
          cd blender-src
          git lfs install --local
          git lfs pull --include="release/datafiles/startup.blend" --exclude=""
          python3 build_files/utils/make_update.py --no-blender

      - name: Fetch NVIDIA OptiX 8 headers
        run: |
          set -euxo pipefail
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 3 \
            "https://github.com/NVIDIA/OWL/archive/${OPTIX_HEADERS_COMMIT}.tar.gz" \
            -o optix-headers.tar.gz
          mkdir -p optix-sdk
          tar -xzf optix-headers.tar.gz -C optix-sdk --strip-components=1
          test -s optix-sdk/3rdParty/optix/include/optix.h
          grep -q '#define OPTIX_VERSION 80000' \
            optix-sdk/3rdParty/optix/include/optix.h

      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: |
          set -euxo pipefail
          cmake -S blender-src -B build -G Ninja \
            -C "${CMAKE_PROFILE}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="${CC}" \
            -DCMAKE_CXX_COMPILER="${CXX}" \
            -DOPTIX_ROOT_DIR="${GITHUB_WORKSPACE}/optix-sdk/3rdParty/optix" \
            -DCMAKE_EXE_LINKER_FLAGS_INIT="-fuse-ld=lld" \
            -DCMAKE_SHARED_LINKER_FLAGS_INIT="-fuse-ld=lld"
          grep -Eq '^OPTIX_INCLUDE_DIR:PATH=.*/optix-sdk/3rdParty/optix/include$' \
            build/CMakeCache.txt
          grep -q '^WITH_CYCLES_DEVICE_OPTIX:BOOL=ON$' build/CMakeCache.txt
          grep -q '^WITH_CYCLES_OSL:BOOL=ON$' build/CMakeCache.txt
          grep -q '^WITH_CYCLES_EMBREE:BOOL=OFF$' build/CMakeCache.txt
          grep -q '^WITH_CODEC_FFMPEG:BOOL=ON$' build/CMakeCache.txt
          grep -q '^WITH_OPENGL_BACKEND:BOOL=ON$' build/CMakeCache.txt
          for retained_render_feature in OPENIMAGEDENOISE OPENIMAGEIO OPENCOLORIO OPENVDB; do
            grep -q "^WITH_${retained_render_feature}:BOOL=ON$" build/CMakeCache.txt
          done
          for disabled_runtime_feature in \
            USD \
            MATERIALX \
            HYDRA \
            DRACO \
            CYCLES_DEVICE_HIP \
            CYCLES_HIP_BINARIES \
            CYCLES_DEVICE_HIPRT \
            CYCLES_DEVICE_ONEAPI \
            CYCLES_ONEAPI_BINARIES \
            GHOST_SDL \
            VULKAN_BACKEND; do
            grep -q "^WITH_${disabled_runtime_feature}:BOOL=OFF$" build/CMakeCache.txt
          done
          if [[ "${EXPECT_AUDIO}" == "1" ]]; then
            grep -q '^WITH_AUDASPACE:BOOL=ON$' build/CMakeCache.txt
            grep -q '^WITH_CODEC_SNDFILE:BOOL=ON$' build/CMakeCache.txt
            grep -q '^WITH_RUBBERBAND:BOOL=ON$' build/CMakeCache.txt
          else
            grep -q '^WITH_AUDASPACE:BOOL=OFF$' build/CMakeCache.txt
            grep -q '^WITH_CODEC_SNDFILE:BOOL=OFF$' build/CMakeCache.txt
          fi
          for disabled_audio_backend in JACK OPENAL PULSEAUDIO PIPEWIRE SDL_AUDIO; do
            grep -q "^WITH_${disabled_audio_backend}:BOOL=OFF$" build/CMakeCache.txt
          done

      - name: Build and install
        run: |
          set -euxo pipefail
          cmake --build build --parallel "$(nproc)"
          cmake --build build --target install

      - name: Package runtime variants
        run: |
          set -euxo pipefail

          version="${BLENDER_VERSION}"
          series="${version%.*}"
          stage_dir="blender-${version}-linux-x64"
          asset_prefix="blender-${version}-linux-x64-cycles-headless-rtx-osl${ASSET_SUFFIX}"
          base_root="dist/base/${stage_dir}"

          rm -rf dist
          mkdir -p "$base_root"
          cp -a build/bin/. "$base_root/"

          official_archive="dist/blender-${version}-official.tar.xz"
          official_runtime="dist/official-runtime"
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 3 \
            "https://download.blender.org/release/Blender${series}/blender-${version}-linux-x64.tar.xz" \
            -o "$official_archive"
          mkdir -p "$official_runtime"
          tar -xJf "$official_archive" -C "$official_runtime" \
            --wildcards \
            "*/${series}/scripts/addons_core/cycles/lib/kernel_*.zst" \
            "*/${series}/python/lib/python3.13/site-packages/attrs*" \
            "*/${series}/python/lib/python3.13/site-packages/cattrs*"
          official_kernel_dir="$(find "$official_runtime" -type d -path "*/${series}/scripts/addons_core/cycles/lib" | head -n 1)"
          target_kernel_dir="$base_root/${series}/scripts/addons_core/cycles/lib"
          test -d "$official_kernel_dir"
          mkdir -p "$target_kernel_dir"
          cp -a "$official_kernel_dir"/kernel_*.zst "$target_kernel_dir/"
          official_site_packages="$(find "$official_runtime" -type d -path "*/${series}/python/lib/python3.13/site-packages" | head -n 1)"
          target_site_packages="$base_root/${series}/python/lib/python3.13/site-packages"
          test -d "$official_site_packages/cattrs"
          test -d "$official_site_packages/attrs"
          cp -a "$official_site_packages"/attrs* "$target_site_packages/"
          cp -a "$official_site_packages"/cattrs* "$target_site_packages/"
          for required_kernel in \
            kernel_compute_75.ptx.zst \
            kernel_sm_75.cubin.zst \
            kernel_sm_86.cubin.zst \
            kernel_sm_120.cubin.zst \
            kernel_optix.ptx.zst \
            kernel_optix_osl.ptx.zst \
            kernel_optix_osl_services.ptx.zst \
            kernel_optix_osl_volume.ptx.zst; do
            test -s "$target_kernel_dir/$required_kernel"
          done

          TRIM_PROFILE=farm-nvidia \
            "${GITHUB_WORKSPACE}/trim_blender_runtime_tree.sh" "$base_root"
          "${GITHUB_WORKSPACE}/verify_blender_runtime_tree.sh" "$base_root"

          package_variant() {
            local label="$1"
            local keep_arches="$2"
            local asset_base="$3"
            local work_root="dist/work/${label}/${stage_dir}"
            mkdir -p "$work_root"
            cp -a "$base_root/." "$work_root/"
            if [[ -n "$keep_arches" ]]; then
              TRIM_PROFILE=farm-nvidia \
              TRIM_KEEP_CUDA_ARCHES="$keep_arches" \
                "${GITHUB_WORKSPACE}/trim_blender_runtime_tree.sh" "$work_root"
            fi
            tar -cJf "dist/${asset_base}.tar.xz" -C "dist/work/${label}" "${stage_dir}"
            (
              cd dist
              sha256sum "${asset_base}.tar.xz" | tee "${asset_base}.tar.xz.sha256"
            )
            stat -c '%s' "dist/${asset_base}.tar.xz" | tee "dist/${asset_base}.tar.xz.bytes"
            du -sh "$work_root" | tee "dist/${asset_base}.tar.xz.du"
          }

          package_variant safe "" "${asset_prefix}-safe"
          cp "dist/${asset_prefix}-safe.tar.xz" "dist/${asset_prefix}.tar.xz"
          (
            cd dist
            sha256sum "${asset_prefix}.tar.xz" >"${asset_prefix}.tar.xz.sha256"
          )
          cp "dist/${asset_prefix}-safe.tar.xz.bytes" "dist/${asset_prefix}.tar.xz.bytes"
          cp "dist/${asset_prefix}-safe.tar.xz.du" "dist/${asset_prefix}.tar.xz.du"

          package_variant sm75 "75" "${asset_prefix}-sm75"
          package_variant sm86 "86" "${asset_prefix}-sm86"
          # Blender 5.2 has no distinct sm_89 cubin. NVIDIA guarantees that the
          # sm_86 cubin runs on sm_89, so retain it with the PTX fallback.
          package_variant sm89 "86 89" "${asset_prefix}-sm89"
          package_variant sm120 "120" "${asset_prefix}-sm120"

          ASSET_PREFIX="${asset_prefix}" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          prefix = os.environ["ASSET_PREFIX"]
          dist = Path("dist")
          manifest = {}

          for asset in sorted(dist.glob(f"{prefix}*.tar.xz")):
              digest = hashlib.sha256(asset.read_bytes()).hexdigest()
              manifest[asset.name] = {
                  "sha256": digest,
                  "bytes": asset.stat().st_size,
              }

          (dist / "release-assets.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          {
            echo "STAGE_DIR=${stage_dir}"
            echo "ASSET_PREFIX=${asset_prefix}"
            echo "SAFE_ASSET_NAME=${asset_prefix}-safe.tar.xz"
          } >> "$GITHUB_ENV"

      - name: Smoke render
        run: |
          set -euxo pipefail
          mkdir -p smoke
          cat > smoke/smoke_render.py <<'PY'
          import bpy
          import math
          import os
          import struct
          import wave

          expect_audio = os.environ.get("EXPECT_AUDIO") == "1"
          assert bpy.app.build_options.codec_ffmpeg, "Blender runtime was built without FFmpeg"
          assert bool(bpy.app.build_options.audaspace) is expect_audio, bpy.app.build_options
          assert bool(bpy.app.build_options.codec_sndfile) is expect_audio, bpy.app.build_options
          scene = bpy.context.scene
          scene.render.engine = "CYCLES"
          scene.cycles.device = "CPU"
          scene.cycles.shading_system = True
          scene.cycles.samples = 4
          scene.cycles.use_denoising = True
          scene.cycles.denoiser = "OPENIMAGEDENOISE"
          scene.render.resolution_x = 128
          scene.render.resolution_y = 128
          scene.render.filepath = "//smoke/out.png"
          bpy.ops.object.select_all(action="SELECT")
          bpy.ops.object.delete(use_global=False)
          bpy.ops.mesh.primitive_cube_add(location=(0.0, 0.0, 0.0))
          bpy.ops.object.light_add(type="SUN", location=(4.0, -4.0, 6.0))
          bpy.ops.object.camera_add(location=(4.0, -4.0, 3.0), rotation=(1.1, 0.0, 0.8))
          scene.camera = bpy.context.object
          bpy.ops.render.render(write_still=True)

          if expect_audio:
              sample_rate = 48_000
              duration_seconds = 2
              source_path = os.path.abspath("smoke/tone.wav")
              mixdown_path = os.path.abspath("smoke/mixdown.flac")
              frames = bytearray()
              for sample_index in range(sample_rate * duration_seconds):
                  value = int(0.25 * 32767 * math.sin(2.0 * math.pi * 440.0 * sample_index / sample_rate))
                  frames.extend(struct.pack("<h", value))
              with wave.open(source_path, "wb") as output:
                  output.setnchannels(1)
                  output.setsampwidth(2)
                  output.setframerate(sample_rate)
                  output.writeframes(frames)

              scene.render.fps = 24
              scene.render.fps_base = 1.0
              scene.frame_start = 1
              scene.frame_end = 48
              sequence_editor = scene.sequence_editor_create()
              sequence_editor.strips.new_sound(
                  name="Audio smoke tone",
                  filepath=source_path,
                  channel=1,
                  frame_start=1,
              )
              result = bpy.ops.sound.mixdown(
                  filepath=mixdown_path,
                  check_existing=False,
                  container="FLAC",
                  codec="FLAC",
                  channels="STEREO",
                  format="S16",
                  mixrate=sample_rate,
              )
              assert result == {"FINISHED"}, result
          PY
          "./dist/base/${STAGE_DIR}/blender" --background --factory-startup --python smoke/smoke_render.py
          test -s smoke/out.png
          if [[ "${EXPECT_AUDIO}" == "1" ]]; then
            test -s smoke/mixdown.flac
            test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 smoke/mixdown.flac)" = "flac"
            test "$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of default=noprint_wrappers=1:nokey=1 smoke/mixdown.flac)" = "48000"
            test "$(ffprobe -v error -select_streams a:0 -show_entries stream=channels -of default=noprint_wrappers=1:nokey=1 smoke/mixdown.flac)" = "2"
            ffmpeg -v error -i smoke/mixdown.flac -f s16le -acodec pcm_s16le - \
              | python3 -c 'import sys; payload = sys.stdin.buffer.read(); assert payload and any(payload), "mixdown decoded to silence"'
          fi

      - name: Build summary
        run: |
          set -euxo pipefail
          python3 - <<'PY' | tee dist/build-summary.txt
          import pathlib
          import os

          asset_name = os.environ["SAFE_ASSET_NAME"]
          new_bytes = int(pathlib.Path(f"dist/{asset_name}.bytes").read_text().strip())
          reference_bytes = int(os.environ["REFERENCE_SAFE_BYTES"])
          delta = new_bytes - reference_bytes
          percent = (delta / reference_bytes * 100.0) if reference_bytes else 0.0
          print(f"Runtime profile: {os.environ['RUNTIME_PROFILE']}")
          print(f"FFmpeg v3 reference safe bytes: {reference_bytes}")
          print(f"New safe bytes: {new_bytes}")
          print(f"Compressed delta bytes: {delta}")
          print(f"Compressed delta percent: {percent:.3f}%")
          PY
          cat dist/build-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blender-cycles-runtime-${{ env.BLENDER_VERSION }}-${{ env.RUNTIME_PROFILE }}
          path: |
            dist/**
            smoke/**

      - name: Recheck immutable release target
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          existing_tag="$(git ls-remote --tags origin "refs/tags/${RELEASE_TAG}")"
          if [[ -n "${existing_tag}" ]]; then
            echo "Release tag appeared while the build was running; refusing to overwrite it: ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Publish release assets
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          make_latest: false
          overwrite_files: false
          files: |
            dist/blender-${{ env.BLENDER_VERSION }}-linux-x64-cycles-headless-rtx-osl*.tar.xz
            dist/blender-${{ env.BLENDER_VERSION }}-linux-x64-cycles-headless-rtx-osl*.tar.xz.sha256
            dist/blender-${{ env.BLENDER_VERSION }}-linux-x64-cycles-headless-rtx-osl*.tar.xz.bytes
            dist/blender-${{ env.BLENDER_VERSION }}-linux-x64-cycles-headless-rtx-osl*.tar.xz.du
            dist/release-assets.json
            dist/build-summary.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
