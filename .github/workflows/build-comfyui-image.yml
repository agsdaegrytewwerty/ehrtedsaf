name: Build ProjectSwift ComfyUI Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile.comfyui
      - scripts/projectswift-comfyui-startup.sh
      - .github/workflows/build-comfyui-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and validate image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.comfyui
          platforms: linux/amd64
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/projectswift-comfyui:image-${{ github.sha }}
          provenance: false
          sbom: false
      - name: Verify the installed runtime with networking disabled
        run: |
          image="ghcr.io/${{ github.repository_owner }}/projectswift-comfyui:image-${GITHUB_SHA}"
          docker run --rm --network none \
            --entrypoint /opt/ComfyUI-lean/venv/bin/python \
            "$image" scripts/verify_lean_runtime.py
      - name: Publish the verified image
        run: |
          image="ghcr.io/${{ github.repository_owner }}/projectswift-comfyui:image-${GITHUB_SHA}"
          docker push "$image"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$image")"
          printf 'Verified image: `%s`\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
